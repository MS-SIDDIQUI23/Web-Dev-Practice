<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu or Nav-bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Smooch+Sans:wght@100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
        body{
            background-color: rgb(112, 93, 93);
        }
        .navbar{
            background-color:#0f0f0f ;
        }
        .navbar ul{
            display: flex;
            list-style: none;
            padding: 15px;
        }

        .navbar li a{
            text-decoration: none;
            color: white;
            padding: 10px 20px;
        }
        .navbar li a:hover{
            background-color: orange;
            border-radius: 5px;
        }
        h2{
            font-family:"Smooch Sans", sans-serif;
            font-weight: bold;
            font-size: 45px;
            color: blue;
            background-color: rgb(148, 111, 64);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <h2>This is my Heading</h2>
    <p>Hello user welcome to our website MS Softwere solution</p>
    <p>we offer you best softwere solution with fast service and reasonable price</p>
</body>
</html>
