<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation</title>
    <style>
      .navbar {
        background-color: #7171ac;
      }
      .navbar ul {
        overflow: auto;
      }
      .navbar li {
        font-size: 18px;
        float: left;
        list-style: none;
       
      }
      .navbar li a {
        text-decoration: none;
        padding: 5px 5px;
        display: block;
        margin: 15px 10px;
      }
      .search {
        float: right;
        padding: 15px 25px;
      }
      .navbar input {
        border: 2px solid black;
        width: 132px;
        padding: 7px 10px;
        margin: 7px 12px;
        border-radius: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <ul>
          <li><a href="#"></a>Home</li>
          <li><a href="#"></a>About</li>
          <li><a href="#"></a>services</li>
          <li><a href="#"></a>Contact us</li>
          <div class="search">
            <input
              type="text"
              name="search"
              placeholder="search this website"
            />
          </div>
        </ul>
      </nav>
    </header>
  </body>
</html>
