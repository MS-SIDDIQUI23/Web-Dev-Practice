<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Cascade & Specificity</title>
    <style>
        p { 
            /* Rule #1  */
            /* color: red !important; */
            color: blue;
        }
        p{
            color: red;
        }

        #intro-text { 
            /* Rule #2 */
            /* color: violet; */
        }

        .card p { 
            /* Rule #3 */
            /* color: green; */
        }

        p.text-style { 
            /* Rule #4 */
            /* color: aqua; */
        }
        .parent{

        }
    </style>
</head>

<body>

    <div class="parent">

    </div>
</body>

</html>
